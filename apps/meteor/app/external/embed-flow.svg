<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1666" viewBox="0 0 1560 1666" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif"><defs><marker id="arr-http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5160"/></marker><marker id="arr-msg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d74f5"/></marker><marker id="arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#148a3b"/></marker><marker id="arr-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d1262b"/></marker></defs><rect width="1560" height="1666" fill="#ffffff"/><text x="780.0" y="38" font-size="22" font-weight="bold" fill="#1f2329" text-anchor="middle">SFA app → Rocket.Chat embedded login flow</text><rect x="16" y="148" width="1528" height="120" rx="10" fill="#f4f6f9" stroke="#e1e5eb"/><text x="32" y="170" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="start">0 · Registration — once, when a user is added to the system</text><rect x="16" y="284" width="1528" height="262" rx="10" fill="#f4f6f9" stroke="#e1e5eb"/><text x="32" y="306" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="start">1 · Open the messenger and check the stored session</text><rect x="16" y="562" width="1528" height="524" rx="10" fill="#f4f6f9" stroke="#e1e5eb"/><text x="32" y="584" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="start">2 · No valid session → get a signed assertion and exchange it</text><rect x="16" y="1102" width="1528" height="280" rx="10" fill="#f4f6f9" stroke="#e1e5eb"/><text x="32" y="1124" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="start">3 · Inside Rocket.Chat</text><rect x="16" y="1404" width="1528" height="168" rx="10" fill="#f4f6f9" stroke="#e1e5eb"/><text x="32" y="1426" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="start">4 · A request is reviewed (separate messaging service)</text><line x1="150" y1="132" x2="150" y2="1570" stroke="#c9ced6" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="20" y="62" width="260" height="62" rx="10" fill="#1f2329"/><text x="150" y="88" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">Android app</text><text x="150" y="109" font-size="12" fill="#c9ced6" font-weight="normal" text-anchor="middle">MessengerController (WebView)</text><line x1="450" y1="132" x2="450" y2="1570" stroke="#c9ced6" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="320" y="62" width="260" height="62" rx="10" fill="#1f2329"/><text x="450" y="88" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">SFA backend services</text><text x="450" y="109" font-size="12" fill="#c9ced6" font-weight="normal" text-anchor="middle">MobileAPI · messaging service</text><line x1="780" y1="132" x2="780" y2="1570" stroke="#c9ced6" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="650" y="62" width="260" height="62" rx="10" fill="#1f2329"/><text x="780" y="88" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">embed-landing.html</text><text x="780" y="109" font-size="12" fill="#c9ced6" font-weight="normal" text-anchor="middle">auth shim page in the WebView</text><line x1="1100" y1="132" x2="1100" y2="1570" stroke="#c9ced6" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="970" y="62" width="260" height="62" rx="10" fill="#1f2329"/><text x="1100" y="88" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">Rocket.Chat server</text><text x="1100" y="109" font-size="12" fill="#c9ced6" font-weight="normal" text-anchor="middle">REST + DDP</text><line x1="1410" y1="132" x2="1410" y2="1570" stroke="#c9ced6" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="1280" y="62" width="260" height="62" rx="10" fill="#1f2329"/><text x="1410" y="88" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">Rocket.Chat web client</text><text x="1410" y="109" font-size="12" fill="#c9ced6" font-weight="normal" text-anchor="middle">/home in the same WebView</text><circle cx="44" cy="201" r="11" fill="#1f2329"/><text x="44" y="205.5" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">0</text><line x1="450" y1="205" x2="1094" y2="205" stroke="#4a5160" stroke-width="1.8" marker-end="url(#arr-http)"/><text x="775.0" y="198" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">POST /api/v1/external.register</text><text x="775.0" y="222" font-size="11.5" fill="#6c727a" font-weight="normal" text-anchor="middle">HMAC headers: x-partner-id · x-timestamp · x-signature</text><line x1="1100" y1="252" x2="456" y2="252" stroke="#4a5160" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr-http)"/><text x="775.0" y="245" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">{ userId = RC _id, key = AES-GCM(K_user, sha256(partnerSecret)) }</text><rect x="1185.0" y="160" width="250" height="42" rx="6" fill="#fff8e1" stroke="#e8c66a"/><text x="1310" y="178" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">upsert user · create K_user once</text><text x="1310" y="194" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">DMs + parent groups</text><circle cx="44" cy="326" r="11" fill="#1f2329"/><text x="44" y="330.5" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">1</text><line x1="150" y1="330" x2="774" y2="330" stroke="#4a5160" stroke-width="1.8" marker-end="url(#arr-http)"/><text x="465.0" y="323" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">loadRequest(https://&lt;rc&gt;/embed-landing.html)</text><line x1="150" y1="372" x2="774" y2="372" stroke="#1d74f5" stroke-width="1.8" marker-end="url(#arr-msg)"/><text x="465.0" y="365" font-size="12.5" fill="#1d74f5" font-weight="normal" text-anchor="middle">onPageFinished → postMessage RC_CONTEXT</text><text x="465.0" y="389" font-size="11.5" fill="#6c727a" font-weight="normal" text-anchor="middle">{ expectedUserId, partnerId, tag, theme }</text><rect x="630.0" y="400" width="300" height="42" rx="6" fill="#fff8e1" stroke="#e8c66a"/><text x="780" y="418" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">apply theme to the shim page</text><text x="780" y="434" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">start ONE session flow (repeats ignored)</text><line x1="780" y1="470" x2="1094" y2="470" stroke="#4a5160" stroke-width="1.8" marker-end="url(#arr-http)"/><text x="940.0" y="463" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">stored token? POST /api/v1/login { resume }</text><line x1="1100" y1="500" x2="786" y2="500" stroke="#4a5160" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr-http)"/><text x="940.0" y="493" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">checks: expiry · active · roles · blocking</text><rect x="615.0" y="512" width="330" height="26" rx="6" fill="#e9f7ee" stroke="#148a3b"/><text x="780" y="530" font-size="12.5" fill="#148a3b" font-weight="normal" text-anchor="middle">valid → location.replace(&quot;/home&quot;)  ⟶  section 3</text><circle cx="44" cy="606" r="11" fill="#1f2329"/><text x="44" y="610.5" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">2</text><line x1="780" y1="610" x2="156" y2="610" stroke="#1d74f5" stroke-width="1.8" marker-end="url(#arr-msg)"/><text x="465.0" y="603" font-size="12.5" fill="#1d74f5" font-weight="normal" text-anchor="middle">RCBridge: RC_NEEDS_ASSERTION { expectedUserId }</text><rect x="40.0" y="622" width="220" height="26" rx="6" fill="#fff8e1" stroke="#e8c66a"/><text x="150" y="640" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">start 30s assertion timer</text><line x1="150" y1="690" x2="444" y2="690" stroke="#4a5160" stroke-width="1.8" marker-end="url(#arr-http)"/><text x="300.0" y="683" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">getSignature()</text><rect x="260.0" y="702" width="380" height="58" rx="6" fill="#fff8e1" stroke="#e8c66a"/><text x="450" y="720" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">K_user = decrypt(MessengerUserKey, partnerSecret)</text><text x="450" y="736" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">sig = HMAC(K_user, partnerId|userId|tag|exp)</text><text x="450" y="752" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">exp = now + 90s</text><line x1="450" y1="790" x2="156" y2="790" stroke="#4a5160" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr-http)"/><text x="300.0" y="783" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">{ signature, expirationDate }</text><line x1="150" y1="832" x2="774" y2="832" stroke="#1d74f5" stroke-width="1.8" marker-end="url(#arr-msg)"/><text x="465.0" y="825" font-size="12.5" fill="#1d74f5" font-weight="normal" text-anchor="middle">postMessage RC_ASSERTION</text><text x="465.0" y="849" font-size="11.5" fill="#6c727a" font-weight="normal" text-anchor="middle">{ partnerId, userId, tag, exp, signature }</text><line x1="780" y1="884" x2="1094" y2="884" stroke="#4a5160" stroke-width="1.8" marker-end="url(#arr-http)"/><text x="940.0" y="877" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">POST /api/v1/external.exchange</text><rect x="975.0" y="896" width="250" height="58" rx="6" fill="#fff8e1" stroke="#e8c66a"/><text x="1100" y="914" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">fields · exp · key/partner · tag</text><text x="1100" y="930" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">signature · active · roles</text><text x="1100" y="946" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">→ mint resume token</text><line x1="1100" y1="972" x2="786" y2="972" stroke="#4a5160" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr-http)"/><text x="940.0" y="965" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">{ userId, authToken }</text><line x1="780" y1="1004" x2="1094" y2="1004" stroke="#4a5160" stroke-width="1.8" marker-end="url(#arr-http)"/><text x="940.0" y="997" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">verify: POST /api/v1/login { resume }</text><line x1="780" y1="1040" x2="156" y2="1040" stroke="#148a3b" stroke-width="1.8" marker-end="url(#arr-ok)"/><text x="465.0" y="1033" font-size="12.5" fill="#148a3b" font-weight="normal" text-anchor="middle">RCBridge: RC_ASSERTION_SUCCESS → app stops 30s timer</text><rect x="550.0" y="1050" width="460" height="26" rx="6" fill="#e9f7ee" stroke="#148a3b"/><text x="780" y="1068" font-size="12.5" fill="#148a3b" font-weight="normal" text-anchor="middle">store Meteor.loginToken / Meteor.userId → location.replace(&quot;/home&quot;)</text><line x1="780" y1="1034" x2="780" y2="1034" /><circle cx="44" cy="1142" r="11" fill="#1f2329"/><text x="44" y="1146.5" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">3</text><line x1="780" y1="1146" x2="1404" y2="1146" stroke="#4a5160" stroke-width="1.8" marker-end="url(#arr-http)"/><text x="1095.0" y="1139" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">full page load: /home</text><line x1="1410" y1="1186" x2="1106" y2="1186" stroke="#4a5160" stroke-width="1.8" marker-end="url(#arr-http)"/><text x="1255.0" y="1179" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">DDP resume with Meteor.loginToken</text><line x1="150" y1="1228" x2="1404" y2="1228" stroke="#1d74f5" stroke-width="1.8" marker-end="url(#arr-msg)"/><text x="780.0" y="1221" font-size="12.5" fill="#1d74f5" font-weight="normal" text-anchor="middle">onPageFinished → postMessage RC_CONTEXT { theme }</text><line x1="1410" y1="1282" x2="1106" y2="1282" stroke="#4a5160" stroke-width="1.8" marker-end="url(#arr-http)"/><text x="1255.0" y="1260" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">users.setPreferences { themeAppearence }</text><text x="1255.0" y="1275" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">(only if the theme changed)</text><rect x="1225.0" y="1302" width="310" height="42" rx="6" fill="#fdecec" stroke="#d1262b"/><text x="1380" y="1320" font-size="12.5" fill="#d1262b" font-weight="normal" text-anchor="middle">session drops later (logout, rejected</text><text x="1380" y="1336" font-size="12.5" fill="#d1262b" font-weight="normal" text-anchor="middle">resume on reload/reconnect) → RC login page</text><text x="1380" y="1362" font-size="11.5" fill="#d1262b" font-weight="normal" text-anchor="middle" font-style="italic">planned: redirect to /embed-landing.html instead</text><circle cx="44" cy="1452" r="11" fill="#1f2329"/><text x="44" y="1456.5" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">4</text><line x1="450" y1="1456" x2="1094" y2="1456" stroke="#4a5160" stroke-width="1.8" marker-end="url(#arr-http)"/><text x="775.0" y="1449" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">messaging service: POST /api/v1/mobile.review-request</text><line x1="1100" y1="1492" x2="1404" y2="1492" stroke="#4a5160" stroke-width="1.8" marker-end="url(#arr-http)"/><text x="1255.0" y="1485" font-size="12.5" fill="#4a5160" font-weight="normal" text-anchor="middle">notifyUser(&#x27;request-reviewed&#x27;)</text><line x1="1410" y1="1536" x2="156" y2="1536" stroke="#1d74f5" stroke-width="1.8" marker-end="url(#arr-msg)"/><text x="780.0" y="1529" font-size="12.5" fill="#1d74f5" font-weight="normal" text-anchor="middle">window.postMessage → rcbridge.ts → RCBridge: RC_REQUEST_REVIEWED { payload }</text><rect x="55.0" y="1546" width="290" height="26" rx="6" fill="#fff8e1" stroke="#e8c66a"/><text x="200" y="1564" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">handleReviewedRequest → apply permission</text><rect x="1050.0" y="600" width="330" height="206" rx="8" fill="#fdecec" stroke="#d1262b"/><text x="1215" y="622" font-size="13" fill="#d1262b" font-weight="bold" text-anchor="middle">Any failure in sections 1–2</text><text x="1215" y="646" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">clear tokens · show &quot;Auth failed&quot;</text><text x="1215" y="668" font-size="12.5" fill="#d1262b" font-weight="normal" text-anchor="middle">RCBridge: RC_ASSERTION_FAILED { code }</text><text x="1215" y="690" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">codes: missing-fields · assertion-expired</text><text x="1215" y="712" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">key-not-authorized · tag-mismatch</text><text x="1215" y="734" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">bad-signature · user-inactive · login-blocked</text><text x="1215" y="756" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="middle">session-rejected · rate-limited · …</text><text x="1215" y="778" font-size="12.5" fill="#d1262b" font-weight="normal" text-anchor="middle">app ignores it today → 30s timer error</text><line x1="40" y1="1604" x2="90" y2="1604" stroke="#1d74f5" stroke-width="1.8" marker-end="url(#arr-msg)"/><text x="100" y="1608" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="start">postMessage / RCBridge (JavaScript messages)</text><line x1="430" y1="1604" x2="480" y2="1604" stroke="#4a5160" stroke-width="1.8" marker-end="url(#arr-http)"/><text x="490" y="1608" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="start">HTTP / DDP request</text><line x1="660" y1="1604" x2="710" y2="1604" stroke="#4a5160" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr-http)"/><text x="720" y="1608" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="start">response</text><rect x="830" y="1595" width="22" height="16" rx="3" fill="#e9f7ee" stroke="#148a3b"/><text x="860" y="1608" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="start">success path</text><rect x="980" y="1595" width="22" height="16" rx="3" fill="#fdecec" stroke="#d1262b"/><text x="1010" y="1608" font-size="12.5" fill="#1f2329" font-weight="normal" text-anchor="start">failure / known gap</text></svg>