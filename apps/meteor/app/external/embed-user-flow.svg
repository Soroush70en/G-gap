<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="2130" viewBox="0 0 1560 2130" font-family="Vazirmatn, Segoe UI, DejaVu Sans, Arial, sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5160"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d74f5"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#148a3b"/></marker></defs><rect width="1560" height="2130" fill="#fff"/><text x="780.0" y="44" font-size="24" font-weight="bold" fill="#1f2329" text-anchor="middle">Opening the Messenger: what the app user gets</text><text x="780.0" y="68" font-size="13.5" fill="#6c727a" text-anchor="middle">Current behavior of the app (MessengerController) with today’s Rocket.Chat changes</text><rect x="430.0" y="85.0" width="340" height="50" rx="25.0" fill="#1f2329"/><text x="600" y="115" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">START · user opens Messenger</text><path d="M600,135 L600,160.0" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><polygon points="600,160.0 760.0,220 600,280.0 440.0,220" fill="#fff8e1" stroke="#d4a72c" stroke-width="1.5"/><text x="600" y="216" font-size="13" fill="#1f2329" font-weight="bold" text-anchor="middle">Messenger URL</text><text x="600" y="234" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">is valid http(s)?</text><path d="M760.0,220 L920,220" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><text x="772.0" y="212" font-size="12.5" fill="#4a5160" font-weight="bold" text-anchor="start">No</text><rect x="920.0" y="181.0" width="560" height="78" rx="12" fill="#fdecec" stroke="#d1262b" stroke-width="2"/><text x="1200" y="205.0" font-size="14" fill="#d1262b" font-weight="bold" text-anchor="middle">Error screen</text><text x="1200" y="227.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle" direction="rtl" unicode-bidi="embed">آدرس پیام‌رسان معتبر نیست</text><text x="1200" y="246.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">Messenger address is not valid.</text><path d="M600,280.0 L600,309" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><text x="610" y="302.0" font-size="12.5" fill="#4a5160" font-weight="bold" text-anchor="start">Yes</text><rect x="410.0" y="309.0" width="380" height="62" rx="6" fill="#eef3fb" stroke="#7a9cc6" stroke-width="1.5"/><text x="600" y="333.0" font-size="13" fill="#1f2329" font-weight="bold" text-anchor="middle">Load /embed-landing.html</text><text x="600" y="351.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">user sees: loading</text><path d="M600,371 L600,400.0" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><polygon points="600,400.0 760.0,460 600,520.0 440.0,460" fill="#fff8e1" stroke="#d4a72c" stroke-width="1.5"/><text x="600" y="456" font-size="13" fill="#1f2329" font-weight="bold" text-anchor="middle">Page loaded?</text><text x="600" y="474" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">network · HTTP · SSL</text><path d="M760.0,460 L920,460" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><text x="772.0" y="452" font-size="12.5" fill="#4a5160" font-weight="bold" text-anchor="start">No</text><rect x="920.0" y="373.5" width="560" height="173" rx="12" fill="#fdecec" stroke="#d1262b" stroke-width="2"/><text x="1200" y="397.5" font-size="14" fill="#d1262b" font-weight="bold" text-anchor="middle">Error screen (one of)</text><text x="1200" y="419.5" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle" direction="rtl" unicode-bidi="embed">بارگذاری پیام‌رسان ناموفق بود</text><text x="1200" y="438.5" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle" direction="rtl" unicode-bidi="embed">اتصال اینترنت را بررسی کنید</text><text x="1200" y="457.5" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">network error: check the internet connection</text><text x="1200" y="476.5" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle" direction="rtl" unicode-bidi="embed">سرور پیام‌رسان در دسترس نیست</text><text x="1200" y="495.5" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">HTTP error: messenger server unavailable</text><text x="1200" y="514.5" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle" direction="rtl" unicode-bidi="embed">برقراری ارتباط امن با پیام‌رسان ممکن نیست</text><text x="1200" y="533.5" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">SSL error: check the server certificate and device date</text><path d="M600,520.0 L600,554" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><text x="610" y="542.0" font-size="12.5" fill="#4a5160" font-weight="bold" text-anchor="start">Yes</text><rect x="410.0" y="554.0" width="380" height="62" rx="6" fill="#eef3fb" stroke="#7a9cc6" stroke-width="1.5"/><text x="600" y="578.0" font-size="13" fill="#1f2329" font-weight="bold" text-anchor="middle">App posts context to the page</text><text x="600" y="596.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">user, partner, tag, theme</text><text x="800" y="590" font-size="12" fill="#1d74f5" font-weight="normal" text-anchor="start">→ RC_CONTEXT</text><path d="M600,616 L600,645.0" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><polygon points="600,645.0 760.0,705 600,765.0 440.0,705" fill="#fff8e1" stroke="#d4a72c" stroke-width="1.5"/><text x="600" y="701" font-size="13" fill="#1f2329" font-weight="bold" text-anchor="middle">Delivered</text><text x="600" y="719" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">within 30s?</text><path d="M760.0,705 L920,705" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><text x="772.0" y="697" font-size="12.5" fill="#4a5160" font-weight="bold" text-anchor="start">No</text><rect x="920.0" y="666.0" width="560" height="78" rx="12" fill="#fdecec" stroke="#d1262b" stroke-width="2"/><text x="1200" y="690.0" font-size="14" fill="#d1262b" font-weight="bold" text-anchor="middle">Error screen</text><text x="1200" y="712.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle" direction="rtl" unicode-bidi="embed">ارتباط با پیام‌رسان برقرار نشد</text><text x="1200" y="731.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">Could not connect to the messenger.</text><path d="M600,765.0 L600,830.0" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><text x="610" y="787.0" font-size="12.5" fill="#4a5160" font-weight="bold" text-anchor="start">Yes</text><polygon points="600,825.0 770.0,890 600,955.0 430.0,890" fill="#fff8e1" stroke="#d4a72c" stroke-width="1.5"/><text x="600" y="877" font-size="13" fill="#1f2329" font-weight="bold" text-anchor="middle">Stored session</text><text x="600" y="895" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">still valid?</text><text x="600" y="913" font-size="13" fill="#6c727a" font-weight="None" text-anchor="middle" direction="rtl" unicode-bidi="embed">(resume login check)</text><path d="M430,890 L120,890 L120,1660 L400,1660" fill="none" stroke="#148a3b" stroke-width="1.8" marker-end="url(#a-green)"/><text x="130" y="880" font-size="12.5" fill="#148a3b" font-weight="bold" text-anchor="start">Yes · no login needed</text><path d="M600,955 L600,995" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><text x="610" y="977" font-size="12.5" fill="#4a5160" font-weight="bold" text-anchor="start">No</text><rect x="410.0" y="995.0" width="380" height="80" rx="6" fill="#eef3fb" stroke="#7a9cc6" stroke-width="1.5"/><text x="600" y="1019.0" font-size="13" fill="#1f2329" font-weight="bold" text-anchor="middle">Page asks the app for a login</text><text x="600" y="1037.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">app starts a 30s timer</text><text x="600" y="1055.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">user sees: loading</text><text x="800" y="1040" font-size="12" fill="#1d74f5" font-weight="normal" text-anchor="start">← RC_NEEDS_ASSERTION</text><path d="M600,1075 L600,1105.0" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><polygon points="600,1105.0 760.0,1165 600,1225.0 440.0,1165" fill="#fff8e1" stroke="#d4a72c" stroke-width="1.5"/><text x="600" y="1161" font-size="13" fill="#1f2329" font-weight="bold" text-anchor="middle">getSignature()</text><text x="600" y="1179" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">call succeeded?</text><path d="M760.0,1165 L920,1165" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><text x="772.0" y="1157" font-size="12.5" fill="#4a5160" font-weight="bold" text-anchor="start">No</text><rect x="920.0" y="1107.0" width="560" height="116" rx="12" fill="#fdecec" stroke="#d1262b" stroke-width="2"/><text x="1200" y="1131.0" font-size="14" fill="#d1262b" font-weight="bold" text-anchor="middle">Error screen (one of)</text><text x="1200" y="1153.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle" direction="rtl" unicode-bidi="embed">دریافت اطلاعات ورود به پیام‌رسان ناموفق بود</text><text x="1200" y="1172.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">backend returned an error</text><text x="1200" y="1191.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle" direction="rtl" unicode-bidi="embed">ورود به پیام‌رسان ناموفق بود</text><text x="1200" y="1210.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">unexpected exception in the app</text><path d="M600,1225.0 L600,1259" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><text x="610" y="1247.0" font-size="12.5" fill="#4a5160" font-weight="bold" text-anchor="start">Yes</text><rect x="410.0" y="1259.0" width="380" height="62" rx="6" fill="#eef3fb" stroke="#7a9cc6" stroke-width="1.5"/><text x="600" y="1283.0" font-size="13" fill="#1f2329" font-weight="bold" text-anchor="middle">App sends the signed login</text><text x="600" y="1301.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">signature valid for 90s</text><text x="800" y="1295" font-size="12" fill="#1d74f5" font-weight="normal" text-anchor="start">→ RC_ASSERTION</text><path d="M600,1321 L600,1375.0" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><polygon points="600,1375.0 760.0,1435 600,1495.0 440.0,1435" fill="#fff8e1" stroke="#d4a72c" stroke-width="1.5"/><text x="600" y="1431" font-size="13" fill="#1f2329" font-weight="bold" text-anchor="middle">Exchange + verify</text><text x="600" y="1449" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">succeeded?</text><path d="M760.0,1435 L920,1435" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><text x="772.0" y="1427" font-size="12.5" fill="#4a5160" font-weight="bold" text-anchor="start">No</text><rect x="920.0" y="1388.0" width="560" height="154" rx="12" fill="#fdecec" stroke="#d1262b" stroke-width="2"/><text x="1200" y="1412.0" font-size="14" fill="#d1262b" font-weight="bold" text-anchor="middle">Page shows &quot;Auth failed&quot; · app shows loading</text><text x="1200" y="1434.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">page sends ← RC_ASSERTION_FAILED { code }  (app ignores it today)</text><text x="1200" y="1453.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">codes: missing-fields (no SalesTeamMessenger row) · assertion-expired</text><text x="1200" y="1472.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">key-not-authorized · tag-mismatch · bad-signature · user-inactive</text><text x="1200" y="1491.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">user-has-no-roles · login-blocked · session-rejected · rate-limited</text><text x="1200" y="1510.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">then, when the 30s timer fires, the error screen:</text><text x="1200" y="1529.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle" direction="rtl" unicode-bidi="embed">تأیید ورود به پیام‌رسان دریافت نشد</text><path d="M600,1495.0 L600,1549" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><text x="610" y="1517.0" font-size="12.5" fill="#4a5160" font-weight="bold" text-anchor="start">Yes</text><rect x="400.0" y="1549.0" width="400" height="62" rx="6" fill="#eef3fb" stroke="#7a9cc6" stroke-width="1.5"/><text x="600" y="1573.0" font-size="13" fill="#1f2329" font-weight="bold" text-anchor="middle">Page tells the app: login OK</text><text x="600" y="1591.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">app stops the 30s timer · redirect to /home</text><text x="810" y="1585" font-size="12" fill="#1d74f5" font-weight="normal" text-anchor="start">← RC_ASSERTION_SUCCESS</text><path d="M600,1611 L600,1632" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><rect x="400.0" y="1630.5" width="400" height="59" rx="12" fill="#e9f7ee" stroke="#148a3b" stroke-width="2"/><text x="600" y="1654.5" font-size="14" fill="#148a3b" font-weight="bold" text-anchor="middle">Chat is usable</text><text x="600" y="1676.5" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">theme from the app is applied</text><path d="M600,1690 L600,1725.0" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><polygon points="600,1725.0 760.0,1785 600,1845.0 440.0,1785" fill="#fff8e1" stroke="#d4a72c" stroke-width="1.5"/><text x="600" y="1781" font-size="13" fill="#1f2329" font-weight="bold" text-anchor="middle">Session stays valid</text><text x="600" y="1799" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">while chatting?</text><path d="M760.0,1785 L920,1785" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><text x="772.0" y="1777" font-size="12.5" fill="#4a5160" font-weight="bold" text-anchor="start">No</text><rect x="920.0" y="1746.0" width="560" height="78" rx="12" fill="#fdecec" stroke="#d1262b" stroke-width="2"/><text x="1200" y="1770.0" font-size="14" fill="#d1262b" font-weight="bold" text-anchor="middle">Rocket.Chat login page</text><text x="1200" y="1792.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">Logout menu item, or resume rejected after a reload/reconnect</text><text x="1200" y="1811.0" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">TODO: redirect to /embed-landing.html instead</text><path d="M600,1845.0 L600,1895" fill="none" stroke="#4a5160" stroke-width="1.8" marker-end="url(#a-gray)"/><text x="610" y="1867.0" font-size="12.5" fill="#4a5160" font-weight="bold" text-anchor="start">Yes</text><rect x="470.0" y="1895.0" width="260" height="50" rx="25.0" fill="#148a3b"/><text x="600" y="1925" font-size="15" fill="#fff" font-weight="bold" text-anchor="middle">END · user chats</text><rect x="920" y="1868" width="560" height="104" rx="8" fill="#f4f6f9" stroke="#c9ced6"/><text x="1200" y="1894" font-size="13.5" fill="#1f2329" font-weight="bold" text-anchor="middle">Every error screen offers Retry</text><text x="1200" y="1914" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle">the app reloads /embed-landing.html and the flow restarts at “Load”</text><text x="1200" y="1934" font-size="13" fill="#6c727a" font-weight="normal" text-anchor="middle">most messages also end with “please try again”:</text><text x="1200" y="1954" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="middle" direction="rtl" unicode-bidi="embed">لطفاً دوباره تلاش کنید</text><rect x="40" y="2074" width="40" height="20" rx="10" fill="#1f2329"/><text x="90" y="2089" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="start">start / end</text><rect x="212.5" y="2074" width="40" height="20" rx="3" fill="#eef3fb" stroke="#7a9cc6"/><text x="262.5" y="2089" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="start">step</text><polygon points="352.5,2072 372.5,2084 352.5,2096 332.5,2084" fill="#fff8e1" stroke="#d4a72c"/><text x="382.5" y="2089" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="start">decision</text><rect x="482.5" y="2074" width="40" height="20" rx="6" fill="#e9f7ee" stroke="#148a3b" stroke-width="2"/><text x="532.5" y="2089" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="start">success</text><rect x="625.0" y="2074" width="40" height="20" rx="6" fill="#fdecec" stroke="#d1262b" stroke-width="2"/><text x="675.0" y="2089" font-size="13" fill="#1f2329" font-weight="normal" text-anchor="start">what the user sees on failure</text><text x="932.5" y="2089" font-size="13" fill="#1d74f5" font-weight="normal" text-anchor="start">RC_… = message between the app and the page</text></svg>